<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korwell · Cloudflare login mockup</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f0ed;
      --ink: #382811;
      font: 16px/1.5 system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      display: grid;
      place-content: center;
      min-height: 100svh;
      padding: 2rem 1rem;
    }
    header, footer { text-align: center; }
    header { margin-bottom: 1.5rem; }
    header svg { display: block; margin: 0 auto 0.5rem; }
    header p { margin: 0; font-size: 1.125rem; font-weight: 650; }
    .card {
      width: min(26rem, calc(100vw - 2rem));
      padding: clamp(1.25rem, 5vw, 2rem);
      background: #fff;
      color: #26262b;
      border: 1px solid #dddde1;
      border-radius: 0.625rem;
      box-shadow: 0 3px 14px #38281112;
    }
    h1, h2 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 1rem; }
    .card p { margin: 0 0 1rem; font-size: 0.9rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.875rem; font-weight: 650; }
    input {
      display: block;
      width: 100%;
      min-height: 2.75rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid #858590;
      border-radius: 0.375rem;
      font: inherit;
    }
    .button {
      display: block;
      margin-top: 1rem;
      padding: 0.65rem 1rem;
      border-radius: 0.375rem;
      background: #0055cf;
      color: #fff;
      text-align: center;
      font-weight: 650;
      text-decoration: none;
    }
    .button:hover { background: #0043a5; }
    .button:focus-visible { outline: 2px solid #0055cf; outline-offset: 3px; }
    .back { display: inline-block; margin-top: 1rem; color: #0055cf; }
    #code { display: none; }
    #code:target { display: block; }
    #code:target + #email { display: none; }
    footer { margin-top: 1.35rem; font-size: 0.875rem; }
    .preview-note { margin: 0.75rem 0 0; color: #695944; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <svg width="70" height="70" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#fd4e1f" d="M1 16C5 9 10 5 16 5s11 4 15 11c-4 7-9 11-15 11S5 23 1 16Z"/>
        <circle cx="17" cy="16" r="6" fill="#382811"/>
        <circle cx="19" cy="14" r="1.5" fill="#f2f0ed"/>
      </svg>
      <p>The Kaldi Archive</p>
    </header>

    <section class="card" id="code" aria-labelledby="code-title">
      <h1 id="code-title">Enter your login code</h1>
      <p>Check your inbox for a one-time code.</p>
      <label for="login-code">Login code</label>
      <input id="login-code" value="••••••" readonly>
      <a class="back" href="#email">Back to email</a>
    </section>

    <section class="card" id="email" aria-labelledby="email-title">
      <h1 id="email-title">Log in to Korwell Access Test</h1>
      <label for="work-email">Email</label>
      <input id="work-email" type="email" value="you@kaldi.si" readonly>
      <a class="button" href="#code">Send login code</a>
    </section>

    <footer>
      Sign in with your @kaldi.si work email.
      <p class="preview-note">Local mockup. No email is sent.</p>
    </footer>
  </main>
</body>
</html>
